image:
  - file: "images/notready.png"
    id: notready_img
    type: RGB
    transparency: alpha_channel
  - file: "images/error.png"
    id: error_img
    type: RGB
    transparency: alpha_channel
  - file: "images/idle.png"
    id: idle_img
    type: RGB
    transparency: alpha_channel
  - file: "images/listening.png"
    id: listening_img
    type: RGB
    transparency: alpha_channel
  - file: "images/thinking.png"
    id: thinking_img
    type: RGB
    transparency: alpha_channel
  - file: "images/replying.png"
    id: replying_img
    type: RGB
    transparency: alpha_channel
  - file: "images/loading.png"
    id: loading_img
    type: RGB
    transparency: alpha_channel
  - file: "images/sleeping.png"
    id: sleeping_img
    type: RGB
    transparency: alpha_channel
  # Small Tez wordmark shown on the provisioning screen
  - file: "images/tez_logo.png"
    id: tez_logo_img
    type: RGB
    transparency: alpha_channel

color:
