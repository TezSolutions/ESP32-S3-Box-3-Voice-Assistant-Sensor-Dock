# Search for "TODO" and adjust as necessary
substitutions:
  name: sentinel-box3
  friendly_name: Sentinel S3 Box 3
  micro_wake_word_model: hey_jarvis  # options: okay_nabu, hey_jarvis, alexa
  noise_suppression_level: '2'

  # ----- Fill these in with your device's values (or !secret refs from secrets.yaml)
  ota_password: !secret ota_password
  encryption_key: !secret encryption_key

  # ----- Sound files served from Home Assistant /local (HTTP: HTTPS adds 2+s lag)
  wakeword_sound: 'http://192.168.1.101:8123/local/sounds/wakeword.mp3'
  success_sound: 'http://192.168.1.101:8123/local/sounds/success.mp3'
  error_sound: 'http://192.168.1.101:8123/local/sounds/error.mp3'

  # ----- don't mess with anything below this line (except, optionally, the TODOs) -----
  VERSION: '1.3.7-sentinel.1'
  ALLOWED_CHARACTERS: " !#%\"'()+,-./0123456789:;<>?@ABCDEFGHIJKLMNOPQRSTUVWYZ[]_abcdefghijklmnopqrstuvwxyz{|}°²³µ¿ÁÂÄÅÉÖÚßàáâãäåæçèéêëìíîðñòóôõöøùúûüýþāăąćčďĐđēėęěğĮįıļľŁłńňőřśšťũūůűųźŻżŽžơưșțΆΈΌΐΑΒΓΔΕΖΗΘΚΜΝΠΡΣΤΥΦάέήίαβγδεζηθικλμνξοπρςστυφχψωϊόύώАБВГДЕЖЗИКЛМНОПРСТУХЦЧШЪЭЮЯабвгдежзийклмнопрстуфхцчшщъыьэюяёђєіїјљњћ"
  
  VA_IN_HOME_ASSISTANT: "In Home Assistant"
  VA_ON_DEVICE: "On device"

  VA_SPEAKER_SPEECH: "Speech"
  VA_SPEAKER_BEEP: "Beep"
  VA_SPEAKER_MUTE: "Mute"

  APP_STATE_LOADING: '0'
  APP_STATE_STATUS: '1'
  APP_STATE_IR_LEARNING: '2'
  APP_STATE_IR_BLAST: '3'
  APP_STATE_VA: '4'
  APP_STATE_SETTINGS: '5'
  APP_STATE_SCREEN_SAVER: '6'
  APP_STATE_TOUCHSCREEN_ERROR: '7'
  NUM_PAGES: '6'

  VA_STATE_NOT_READY: '1'
  VA_STATE_IDLE: '2'
  VA_STATE_LISTENING: '3'
  VA_STATE_THINKING: '4'
  VA_STATE_REPLYING: '5'
  VA_STATE_ERROR: '6'
  VA_STATE_MUTED: '7'

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.2.0
  name_add_mac_suffix: true
  includes:
    - ui_helpers.h
  on_boot:
    priority: 600
    then:
      - switch.turn_on: speaker_enable
      - light.turn_on: 
          id: led
          brightness: 100%
      - display.page.show: loading_page
      - component.update: s3_box_lcd
      - media_player.volume_set:
          id: speaker_media_player
          volume: 60%
      - lambda: |-
          id(mww_jarvis).enable();
  project:
    name: "TezSolutions.SentinelBox3"
    version: ${VERSION}

esp32:
  board: esp32s3box
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

ota:
  - platform: esphome
    password: ${ota_password}

# QR code shown on the loading screen while in WiFi provisioning (fallback AP) mode.
# Encodes the standard WiFi-join format: scan with any phone camera to connect.
# NOTE: keep SSID/password in sync with the wifi: ap: block below.
qr_code:
  - id: provision_qr
    ecc: MEDIUM
    value: 'WIFI:T:WPA;S:${name};P:s3box123;;'

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG
  logs:
    micro_wake_word: DEBUG
    voice_assistant: DEBUG
    remote_receiver: WARN
    remote.pronto: WARN
    remote.raw: WARN
    sensor: WARN
    binary_sensor: WARN
    esp-idf: WARN
    esp_adf_pipeline: WARN
    esp_audio_processors: WARN
    esp_audio_sources: WARN

api:
  id: my_api
  encryption:
    key: ${encryption_key}
  on_client_connected:
    - script.execute: check_touchscreen_failure
    - component.update: s3_box_lcd
  on_client_disconnected:
    - component.update: s3_box_lcd

captive_portal:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Reboot sooner when WiFi is dead so the device re-enters INITIAL_CONNECT;
  # with ap: configured, a failed initial connect raises the fallback hotspot
  # (stuck SCAN_CONNECTING/RETRY_HIDDEN loops never reach the AP trigger).
  reboot_timeout: 5min
  ap:
    ssid: ${name}
    password: s3box123
    # Raise the fallback hotspot ~30s after boot even while connection retries
    # continue, so provisioning is available immediately (default 90s, and the
    # hidden-candidate retry loop can delay it minutes)
    ap_timeout: 30s
  on_connect:
    - script.execute: check_touchscreen_failure
    - script.wait: check_touchscreen_failure
    - if:
        condition:
          - lambda: return id(touchscreen_error_counter) < 0;
        then:
        - script.execute: box_initialize
        - script.wait: box_initialize
        - script.execute:
            id: change_app_state
            nextState: ${APP_STATE_STATUS}
  on_disconnect:
    - component.update: s3_box_lcd

time:
  - platform: homeassistant
    id: ha_time

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

light:
  - platform: monochromatic
    id: led
    name: 'LCD Screen'
    icon: 'mdi:television'
    entity_category: config
    output: backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 500ms

spi:
  - id: spi_bus
    clk_pin: 7
    mosi_pin: 6

i2c:
  - id: bus_a
    sda: GPIO08
    scl: GPIO18
    scan: false
    sda_pullup_enabled: true
    scl_pullup_enabled: true
    frequency: 100kHz

  - id: bus_b
    sda: GPIO41
    scl: GPIO40
    scan: false
    sda_pullup_enabled: true
    scl_pullup_enabled: true
    frequency: 50kHz

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO2

audio_adc:
  - id: es7210_adc
    platform: es7210
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - id: es8311_dac
    platform: es8311
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    id: box_mic
    sample_rate: 16000
    i2s_din_pin: GPIO16
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_dout_pin: GPIO15
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: left
    audio_dac: es8311_dac
    buffer_duration: 100ms

media_player:
  - id: speaker_media_player
    platform: speaker
    name: "S3 Box 3 Media Player"
    volume_min: 0.3
    volume_max: 0.75
    announcement_pipeline:
      speaker: box_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1  # S3 Box only has one output channel
    on_state:
      - lambda: ESP_LOGD("media_player", "on_state");
    on_play:
      - lambda: ESP_LOGD("media_player", "on_play");
    on_pause:
      - lambda: ESP_LOGD("media_player", "on_pause");
    on_idle:
      - lambda: ESP_LOGD("media_player", "on_idle");
    on_announcement:
      - lambda: ESP_LOGD("media_player", "on_announcement");

micro_wake_word:
  models:
    - model: hey_jarvis
      id: mww_jarvis
      probability_cutoff: 75%
      internal: true
  on_wake_word_detected:
    - if:
        condition:
          - lambda: return id(app_state) == ${APP_STATE_SCREEN_SAVER};
        then:
          - script.execute: 
              id: change_app_state
              nextState: ${APP_STATE_STATUS}
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: box_mic
  media_player: speaker_media_player
  noise_suppression_level: ${noise_suppression_level}
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_client_connected:
    - lambda: ESP_LOGD("voice_assistant_on", "on_client_connected");
    - if:
        condition:
          lambda: return id(mem_wake_word_engine_location).state == "${VA_IN_HOME_ASSISTANT}";
        then:
          - lambda: id(va).set_use_wake_word(true);
          - voice_assistant.start_continuous
        else:
          - lambda: |-
              id(va).set_use_wake_word(false);
              id(mww_jarvis).enable();
          - micro_wake_word.start
    - script.execute:
        id: change_va_state
        nextState: ${VA_STATE_IDLE}
    - lambda: id(va_state) = ${VA_STATE_IDLE};
  on_client_disconnected:
    - lambda: ESP_LOGD("voice_assistant_on", "on_client_disconnected");
    - if:
        condition:
          lambda: return id(mem_wake_word_engine_location).state == "${VA_IN_HOME_ASSISTANT}";
        then:
          - lambda: id(va).set_use_wake_word(false);
        else:
          - micro_wake_word.stop
    - voice_assistant.stop
    - script.execute:
        id: change_va_state
        nextState: ${VA_STATE_NOT_READY}
  on_wake_word_detected:
    - lambda: ESP_LOGD("voice_assistant_on", "on_wake_word_detected");
    - text_sensor.template.publish:
        id: va_request
        state: ""
    - text_sensor.template.publish:
        id: va_response
        state: ""
  on_listening:
    - lambda: ESP_LOGD("voice_assistant_on", "on_listening");
    - script.execute:
        id: change_va_state
        nextState: ${VA_STATE_LISTENING}
  on_stt_vad_start:
    - lambda: ESP_LOGD("voice_assistant_on", "on_stt_vad_start");
  on_stt_vad_end:
    - lambda: ESP_LOGD("voice_assistant_on", "on_stt_vad_end");
    - script.execute:
        id: change_va_state
        nextState: ${VA_STATE_THINKING}
  on_error:
    - lambda: ESP_LOGD("voice_assistant_on", "on_error");
    - if:
        condition:
          - lambda: return id(va_state) != ${VA_STATE_NOT_READY};
        then:
          - script.execute:
              id: change_va_state
              nextState: ${VA_STATE_ERROR}
          - text_sensor.template.publish:
              id: va_response
              state: !lambda return message;
          - if:
              condition:
                lambda: return id(mem_va_speaker_mode).state == "${VA_SPEAKER_BEEP}";
              then:
                - media_player.play_media: ${error_sound}
                - wait_until:
                    condition:
                      media_player.is_idle
                    timeout: 2sec
          #- delay: 3s
          - script.execute:
              id: change_va_state
              nextState: ${VA_STATE_IDLE}
          - if:
              condition:
                lambda: return id(mem_wake_word_engine_location).state == "${VA_ON_DEVICE}";
              then:
                - delay: 500ms
                - micro_wake_word.start
  on_stt_end:
    - lambda: ESP_LOGD("voice_assistant_on", "on_stt_end");
    - text_sensor.template.publish:
        id: va_request
        state: !lambda return x;
    - component.update: s3_box_lcd
  on_tts_start:
    - lambda: ESP_LOGD("voice_assistant_on", "on_tts_start");
    - text_sensor.template.publish:
        id: va_response
        state: !lambda return x;
    - script.execute:
        id: change_va_state
        nextState: ${VA_STATE_REPLYING}
    - if:
        condition:
          - lambda: return id(mem_va_speaker_mode).state != "${VA_SPEAKER_SPEECH}";
        then:
          - wait_until:
              condition:
                not:
                  media_player.is_idle
              timeout: 5sec
          - media_player.stop:
              announcement: true
          - wait_until:
              condition:
                media_player.is_idle
              timeout: 1sec
          - if:
              condition:
                lambda: return id(mem_va_speaker_mode).state == "${VA_SPEAKER_BEEP}";
              then:
                - media_player.play_media: !lambda if(x.rfind("Sorry", 0) == 0) return "${error_sound}"; return "${success_sound}";
                - wait_until:
                    condition:
                      media_player.is_idle
                    timeout: 2sec
  on_end:
    - lambda: ESP_LOGD("voice_assistant_on", "on_end");
    - if:
        condition:
          - lambda: return id(mem_wake_word_engine_location).state == "${VA_ON_DEVICE}";
        then:
          - wait_until:
              condition:
                not:
                  voice_assistant.is_running
              timeout: !lambda 'return id(mem_va_speaker_mode).state != "${VA_SPEAKER_SPEECH}" ? 500 : 180000;' #ms
          - micro_wake_word.start
    - script.execute:
        id: change_va_state
        nextState: ${VA_STATE_IDLE}

  on_intent_start:
    - lambda: ESP_LOGD("voice_assistant_on", "on_intent_start");
  on_intent_end:
    - lambda: ESP_LOGD("voice_assistant_on", "on_intent_end");
  on_start:
    - lambda: ESP_LOGD("voice_assistant_on", "on_start");
  on_tts_end:
    - lambda: ESP_LOGD("voice_assistant_on", "on_tts_end");
  on_idle:
    - lambda: ESP_LOGD("voice_assistant_on", "on_idle");
  on_timer_started:
    - lambda: ESP_LOGD("voice_assistant_on", "on_timer_started");
  on_timer_finished:
    - lambda: ESP_LOGD("voice_assistant_on", "on_timer_finished");
  on_timer_cancelled:
    - lambda: ESP_LOGD("voice_assistant_on", "on_timer_cancelled");
  on_timer_updated:
    - lambda: ESP_LOGD("voice_assistant_on", "on_timer_updated");

touchscreen:
  platform: gt911
  i2c_id: bus_a
  id: gt911_touchscreen
  interrupt_pin: GPIO3

switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  - id: enable_ir
    platform: gpio
    name: "IR Power"
    icon: 'mdi:led-variant-on'
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    pin:
      number: GPIO44
      inverted: true
    on_turn_on: 
      then:
        - component.update: s3_box_lcd
    on_turn_off: 
      then:
        - component.update: s3_box_lcd

select:
  - id: mem_wake_word_engine_location
    platform: template
    entity_category: config
    name: Wake word engine location
    optimistic: true
    restore_value: true
    options:
      - ${VA_ON_DEVICE}
      - ${VA_IN_HOME_ASSISTANT}
    initial_option: ${VA_ON_DEVICE}
    on_value:
      - if:
          condition:
            lambda: return x == "${VA_IN_HOME_ASSISTANT}";
          then:
            - micro_wake_word.stop
            - delay: 500ms
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous
            - text_sensor.template.publish:
                id: wakeword_location
                state: !lambda 'return "Home Assistant";'
            - component.update: s3_box_lcd
          else:
            - text_sensor.template.publish:
                id: wakeword_location
                state: !lambda 'return "On Device";'
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop
            - delay: 500ms
            - micro_wake_word.start
            - component.update: s3_box_lcd
  - id: mem_va_speaker_mode
    platform: template
    entity_category: config
    name: VA Speaker Mode
    optimistic: true
    restore_value: true
    options:
      - ${VA_SPEAKER_SPEECH}
      - ${VA_SPEAKER_BEEP}
      - ${VA_SPEAKER_MUTE}
    on_value:
      - delay: 250ms
      - component.update: s3_box_lcd

sensor:
  - platform: aht10 
    i2c_id: bus_b
    variant: AHT20
    temperature:
      name: "Temperature"
      id: s3temp
    humidity:
      name: "Humidity"
    update_interval: 60s

  - platform: adc
    pin: GPIO10
    name: "Battery voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: "voltage"
    entity_category: "diagnostic"
    disabled_by_default: true
    update_interval: 30s
    attenuation: auto
    filters:
      - multiply: 4.11

  - platform: copy
    id: battery_percent
    source_id: battery_voltage
    name: "Battery level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: "battery"
    entity_category: "diagnostic"
    filters:
      - lambda: return (x - 2.7) / (4.2 - 2.7) * 100;
      - clamp:
          min_value: 0
          max_value: 100

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ESP IP Address
      address_0:
        name: ESP IP Address 0
      id: ip_addr
  - id: wakeword_location
    platform: template
  - id: va_request
    platform: template
  - id: va_response
    platform: template

number:
  - id: mem_settings_sleep_delay
    platform: template
    name: "Sleep Delay"
    icon: 'mdi:sleep'
    entity_category: config
    unit_of_measurement: 'secs'
    optimistic: true
    restore_value: true
    initial_value: 30
    step: 1
    min_value: 1
    max_value: 999999

