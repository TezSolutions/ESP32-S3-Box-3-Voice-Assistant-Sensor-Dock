display:
  - platform: ili9xxx
    id: s3_box_lcd
    model: S3BOX
    invert_colors: false
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 4
    reset_pin:
      number: 48
      inverted: true
    update_interval: never
    pages:
      - id: loading_page
        lambda: |-
          it.fill(Color::BLACK);
          if (wifi::global_wifi_component != nullptr && !wifi::global_wifi_component->is_connected()) {
            // Provisioning mode: fallback AP active — show join QR + connection details
            it.print(160, 12, id(font_title), Color(255,255,255), TextAlign::TOP_CENTER, "WiFi Setup");
            int qr_scale = 3;
            int qr_size = (int) id(provision_qr).get_size() * qr_scale;
            // it.qr_code() takes TOP-LEFT coords, not center. QR is 29 modules
            // × scale 3 = 87px wide; left edge x15 → right edge x102, text at
            // x118 leaves a clear ~16px gap.
            it.qr_code(15, (int)(110 - qr_size / 2), id(provision_qr), Color(255,255,255), qr_scale);
            it.printf(118, 68, id(font_small), Color(255,255,255), "SSID: ${name}");
            it.printf(118, 94, id(font_small), Color(255,255,255), "Pass: s3box123");
            it.printf(118, 120, id(font_small), Color(255,255,255), "Portal:");
            it.printf(118, 140, id(font_small), Color(200,200,200), "http://192.168.4.1");
            it.image(160, 172, id(tez_logo_img), ImageAlign::TOP_CENTER);
            it.printf(160, 212, id(font_small), Color(255,255,255), TextAlign::TOP_CENTER, "Scan QR to join");
          } else {
            it.image(160, 120, id(loading_img), ImageAlign::CENTER);
          }

      - id: status_page
        lambda: |-
          it.fill(Color::BLACK);

          sentinel_ui::draw_top_bar(
            it, "SENTINEL SATELLITE",
            id(font_title), id(font_badge), id(font_icon_bar),
            card_bg, card_border, white, blue_light, green, red, amber, grey,
            network::is_connected(),
            api::global_api_server->is_connected(),
            id(s3temp).has_state() ? id(s3temp).state : 0.0f,
            id(s3temp).has_state(),
            id(enable_ir).state,
            id(battery_percent).has_state() ? (int)id(battery_percent).state : 100,
            id(battery_percent).has_state()
          );

          if (!id(nav_lock)) {
            sentinel_ui::draw_bottom_nav(it, 0, 5, id(font_icon_nav), blue, grey_dark, grey);
          }

          // Cute Robot Mascot Centered (160x130 at y=114)
          if (id(mute_error)) {
            it.image(160, 114, id(error_img), ImageAlign::CENTER);
            sentinel_ui::draw_status_pill(it, 160, 196, 170, 22, card_bg, card_border, red, id(font_badge), red, "HARDWARE MUTED");
          } else {
            switch (id(va_state)) {
              case ${VA_STATE_NOT_READY}:
                it.image(160, 114, id(notready_img), ImageAlign::CENTER);
                sentinel_ui::draw_status_pill(it, 160, 196, 170, 22, card_bg, card_border, grey, id(font_badge), text_dim, "CONNECTING...");
                break;
              case ${VA_STATE_IDLE}:
                it.image(160, 114, id(idle_img), ImageAlign::CENTER);
                if (id(mem_va_speaker_mode).state == "${VA_SPEAKER_MUTE}") {
                  sentinel_ui::draw_status_pill(it, 160, 196, 190, 22, card_bg, card_border, amber, id(font_badge), amber, "MUTED  •  TAP TO WAKE");
                } else {
                  sentinel_ui::draw_status_pill(it, 160, 196, 190, 22, card_bg, card_border, blue, id(font_badge), blue_light, "READY  •  \"HEY JARVIS\"");
                }
                break;
              case ${VA_STATE_LISTENING}:
                it.image(160, 114, id(listening_img), ImageAlign::CENTER);
                sentinel_ui::draw_status_pill(it, 160, 196, 170, 22, card_bg, card_border, blue, id(font_badge), blue, "LISTENING...");
                break;
              case ${VA_STATE_THINKING}:
                it.image(160, 114, id(thinking_img), ImageAlign::CENTER);
                sentinel_ui::draw_status_pill(it, 160, 196, 170, 22, card_bg, card_border, purple, id(font_badge), purple, "PROCESSING...");
                break;
              case ${VA_STATE_REPLYING}:
                it.image(160, 114, id(replying_img), ImageAlign::CENTER);
                sentinel_ui::draw_status_pill(it, 160, 196, 170, 22, card_bg, card_border, green, id(font_badge), green, "SPEAKING...");
                break;
              case ${VA_STATE_ERROR}:
                it.image(160, 114, id(error_img), ImageAlign::CENTER);
                sentinel_ui::draw_status_pill(it, 160, 196, 170, 22, card_bg, card_border, red, id(font_badge), red, "ERROR");
                break;
            }
          }

      - id: ir_learn_page
        lambda: |-
          it.fill(Color::BLACK);

          sentinel_ui::draw_top_bar(
            it, "IR LEARNING",
            id(font_title), id(font_badge), id(font_icon_bar),
            card_bg, card_border, white, blue_light, green, red, amber, grey,
            network::is_connected(),
            api::global_api_server->is_connected(),
            id(s3temp).has_state() ? id(s3temp).state : 0.0f,
            id(s3temp).has_state(),
            id(enable_ir).state,
            id(battery_percent).has_state() ? (int)id(battery_percent).state : 100,
            id(battery_percent).has_state()
          );

          if (!id(nav_lock)) {
            sentinel_ui::draw_bottom_nav(it, 1, 5, id(font_icon_nav), blue, grey_dark, grey);
          }

          if (!id(enable_ir).state) {
            sentinel_ui::draw_rounded_card(it, 20, 80, 280, 70, 8, card_bg, card_border);
            it.print(160, 105, id(font_small), amber, TextAlign::CENTER, "IR sensor dock power required");
            it.print(160, 128, id(font_badge), text_dim, TextAlign::CENTER, "Enable IR transceiver in Home Assistant");
            return;
          }

          if (id(ir_memory_button_selected) == -1) {
            it.print(160, 42, id(font_badge), text_dim, TextAlign::CENTER, "Select a slot to record remote signal:");
            for (int i = 0; i < 4; i++) {
              int sx = 40 + i * 65;
              int sy = 64;
              bool saved = (id(ir_memory_button_codes)[i].length() > 0);
              sentinel_ui::draw_rounded_card(it, sx, sy, 48, 48, 8, saved ? card_active : card_bg, saved ? blue : card_border);
              it.printf(sx + 24, sy + 24, id(font_medium), saved ? white : grey, TextAlign::CENTER, "%d", i + 1);
              it.print(sx + 24, sy + 56, id(font_badge), saved ? blue_light : grey_dark, TextAlign::CENTER, saved ? "SAVED" : "EMPTY");
            }

            sentinel_ui::draw_rounded_card(it, 20, 138, 280, 60, 8, card_bg, card_border);
            it.print(32, 153, id(font_small), white, TextAlign::TOP_LEFT, "1. Tap an empty memory slot above");
            it.print(32, 173, id(font_small), text_dim, TextAlign::TOP_LEFT, "2. Point remote at Sentinel & press button");
          } else {
            it.printf(160, 42, id(font_small), white, TextAlign::CENTER, "Recording Slot %d", id(ir_memory_button_selected) + 1);

            for (int i = 0; i < 4; i++) {
              int sx = 40 + i * 65;
              int sy = 64;
              bool is_target = (id(ir_memory_button_selected) == i);
              bool saved = (id(ir_memory_button_codes)[i].length() > 0);
              sentinel_ui::draw_rounded_card(it, sx, sy, 48, 48, 8, is_target ? card_active : card_bg, is_target ? amber : (saved ? blue : card_border));
              it.printf(sx + 24, sy + 24, id(font_medium), is_target ? amber : (saved ? white : grey), TextAlign::CENTER, "%d", i + 1);
            }

            sentinel_ui::draw_rounded_card(it, 20, 128, 280, 58, 8, card_bg, card_border);
            if (id(ir_learning_state) == 2) {
              it.print(160, 142, id(font_icon_bar), amber, TextAlign::CENTER, "\U000F0330");
              it.print(160, 164, id(font_small), amber, TextAlign::CENTER, "Press remote key now...");
            } else {
              it.print(160, 142, id(font_icon_bar), blue, TextAlign::CENTER, "\U000F032E");
              it.print(160, 164, id(font_small), blue_light, TextAlign::CENTER, "Preparing IR sensor...");
            }

            sentinel_ui::draw_rounded_card(it, 125, 198, 70, 26, 6, card_bg, red);
            it.print(160, 211, id(font_badge), red, TextAlign::CENTER, "CANCEL");
          }

      - id: ir_blast_page
        lambda: |-
          it.fill(Color::BLACK);

          sentinel_ui::draw_top_bar(
            it, "IR TRANSMITTER",
            id(font_title), id(font_badge), id(font_icon_bar),
            card_bg, card_border, white, blue_light, green, red, amber, grey,
            network::is_connected(),
            api::global_api_server->is_connected(),
            id(s3temp).has_state() ? id(s3temp).state : 0.0f,
            id(s3temp).has_state(),
            id(enable_ir).state,
            id(battery_percent).has_state() ? (int)id(battery_percent).state : 100,
            id(battery_percent).has_state()
          );

          if (!id(nav_lock)) {
            sentinel_ui::draw_bottom_nav(it, 2, 5, id(font_icon_nav), blue, grey_dark, grey);
          }

          if (!id(enable_ir).state) {
            sentinel_ui::draw_rounded_card(it, 20, 80, 280, 70, 8, card_bg, card_border);
            it.print(160, 105, id(font_small), amber, TextAlign::CENTER, "IR sensor dock power required");
            it.print(160, 128, id(font_badge), text_dim, TextAlign::CENTER, "Enable IR transceiver in Home Assistant");
            return;
          }

          it.print(160, 42, id(font_badge), text_dim, TextAlign::CENTER, "Tap slot to transmit learned IR signal:");
          for (int i = 0; i < 4; i++) {
            int sx = 40 + i * 65;
            int sy = 64;
            bool saved = (id(ir_memory_button_codes)[i].length() > 0);
            sentinel_ui::draw_rounded_card(it, sx, sy, 48, 48, 8, saved ? card_active : card_bg, saved ? blue : card_border);
            it.printf(sx + 24, sy + 24, id(font_medium), saved ? white : grey, TextAlign::CENTER, "%d", i + 1);
            it.print(sx + 24, sy + 56, id(font_badge), saved ? blue_light : grey_dark, TextAlign::CENTER, saved ? "SAVED" : "EMPTY");
          }

          sentinel_ui::draw_rounded_card(it, 20, 138, 280, 56, 8, card_bg, card_border);
          it.print(40, 166, id(font_icon_bar), blue, TextAlign::CENTER, "\U000F0452");
          it.print(168, 166, id(font_small), blue_light, TextAlign::CENTER, "IR TRANSMITTER READY");

      - id: voice_assistant_page
        lambda: |-
          it.fill(Color::BLACK);

          sentinel_ui::draw_top_bar(
            it, "VOICE ASSISTANT",
            id(font_title), id(font_badge), id(font_icon_bar),
            card_bg, card_border, white, blue_light, green, red, amber, grey,
            network::is_connected(),
            api::global_api_server->is_connected(),
            id(s3temp).has_state() ? id(s3temp).state : 0.0f,
            id(s3temp).has_state(),
            id(enable_ir).state,
            id(battery_percent).has_state() ? (int)id(battery_percent).state : 100,
            id(battery_percent).has_state()
          );

          if (!id(nav_lock)) {
            sentinel_ui::draw_bottom_nav(it, 3, 5, id(font_icon_nav), blue, grey_dark, grey);
          }

          // State header card
          sentinel_ui::draw_rounded_card(it, 14, 34, 292, 24, 6, card_bg, card_border);
          const char *state_txt = "STATUS: READY";
          Color state_col = blue;
          switch (id(va_state)) {
            case ${VA_STATE_IDLE}: state_txt = "STATUS: READY"; state_col = blue; break;
            case ${VA_STATE_LISTENING}: state_txt = "STATUS: LISTENING..."; state_col = blue; break;
            case ${VA_STATE_THINKING}: state_txt = "STATUS: PROCESSING..."; state_col = purple; break;
            case ${VA_STATE_REPLYING}: state_txt = "STATUS: SPEAKING..."; state_col = green; break;
            case ${VA_STATE_NOT_READY}: state_txt = "STATUS: CONNECTING"; state_col = grey; break;
            case ${VA_STATE_ERROR}: state_txt = "STATUS: ERROR"; state_col = red; break;
            case ${VA_STATE_MUTED}: state_txt = "STATUS: MUTED"; state_col = amber; break;
          }
          it.filled_circle(24, 46, 3, state_col);
          it.print(34, 46, id(font_badge), state_col, TextAlign::CENTER_LEFT, state_txt);
          it.printf(294, 46, id(font_badge), text_dim, TextAlign::CENTER_RIGHT, "Jarvis • %s", id(mem_va_speaker_mode).state.c_str());

          bool has_req = (id(va_request).state.length() > 0);
          bool has_res = (id(va_response).state.length() > 0);

          if (has_req || has_res) {
            if (has_req) {
              sentinel_ui::draw_rounded_card(it, 14, 62, 292, 54, 8, card_bg, card_border);
              it.print(24, 74, id(font_icon_bar), blue, TextAlign::TOP_LEFT, "\U000F036C");
              it.print(46, 74, id(font_badge), blue, TextAlign::TOP_LEFT, "You");
              it.print(24, 95, id(font_small), white, TextAlign::TOP_LEFT, id(va_request).state.c_str());
            }
            if (has_res) {
              sentinel_ui::draw_rounded_card(it, 14, 122, 292, 68, 8, card_bg, card_border);
              it.print(24, 134, id(font_icon_bar), green, TextAlign::TOP_LEFT, "\U000F06A9");
              it.print(46, 134, id(font_badge), green, TextAlign::TOP_LEFT, "Sentinel");
              it.print(24, 155, id(font_small), white, TextAlign::TOP_LEFT, id(va_response).state.c_str());
            }
          } else {
            sentinel_ui::draw_rounded_card(it, 20, 68, 280, 122, 8, card_bg, card_border);
            it.image(75, 129, id(idle_img), ImageAlign::CENTER);
            it.print(200, 105, id(font_small), white, TextAlign::CENTER, "\"Hey Jarvis...\"");
            it.print(200, 128, id(font_badge), blue_light, TextAlign::CENTER, "Ask questions,");
            it.print(200, 146, id(font_badge), text_dim, TextAlign::CENTER, "control devices, & more");
          }

          if (id(mute_error)) {
            sentinel_ui::draw_rounded_card(it, 14, 122, 292, 40, 8, card_bg, red);
            it.print(160, 142, id(font_small), red, TextAlign::CENTER, "HW mute error. Reboot to restore.");
          }

      - id: settings_page
        lambda: |-
          it.fill(Color::BLACK);

          sentinel_ui::draw_top_bar(
            it, "SETTINGS",
            id(font_title), id(font_badge), id(font_icon_bar),
            card_bg, card_border, white, blue_light, green, red, amber, grey,
            network::is_connected(),
            api::global_api_server->is_connected(),
            id(s3temp).has_state() ? id(s3temp).state : 0.0f,
            id(s3temp).has_state(),
            id(enable_ir).state,
            id(battery_percent).has_state() ? (int)id(battery_percent).state : 100,
            id(battery_percent).has_state()
          );

          if (!id(nav_lock)) {
            sentinel_ui::draw_bottom_nav(it, 4, 5, id(font_icon_nav), blue, grey_dark, grey);
          }

          // Row 1: Speaker Mode [14..306, 36..76]
          sentinel_ui::draw_rounded_card(it, 14, 36, 292, 40, 8, card_bg, card_border);
          it.print(26, 48, id(font_icon_bar), green, TextAlign::TOP_LEFT, "\U000F057E");
          it.print(52, 56, id(font_small), white, TextAlign::CENTER_LEFT, "Voice Speaker");

          const char* mode_label = "SPEECH";
          Color mode_color = green;
          if (id(mem_va_speaker_mode).state == "${VA_SPEAKER_SPEECH}") {
            mode_label = "SPEECH";
            mode_color = green;
          } else if (id(mem_va_speaker_mode).state == "${VA_SPEAKER_BEEP}") {
            mode_label = "BEEP";
            mode_color = amber;
          } else {
            mode_label = "MUTE";
            mode_color = red;
          }
          sentinel_ui::draw_rounded_card(it, 220, 42, 78, 28, 6, card_bg, mode_color);
          it.print(259, 56, id(font_badge), mode_color, TextAlign::CENTER, mode_label);

          // Row 2: Volume [14..306, 82..122]
          sentinel_ui::draw_rounded_card(it, 14, 82, 292, 40, 8, card_bg, card_border);
          it.print(26, 94, id(font_icon_bar), blue, TextAlign::TOP_LEFT, "\U000F0580");
          it.print(52, 102, id(font_small), white, TextAlign::CENTER_LEFT, "Volume");

          int volume = (id(speaker_media_player).volume - 0.499) * 200;
          if (volume < 0) volume = 0;
          if (volume > 100) volume = 100;
          int fill_w = (volume * 60) / 100;
          it.filled_rectangle(106, 99, 60, 6, card_border);
          if (fill_w > 0) it.filled_rectangle(106, 99, fill_w, 6, blue);

          sentinel_ui::draw_rounded_card(it, 180, 88, 30, 28, 6, card_bg, card_border);
          it.print(195, 102, id(font_medium), white, TextAlign::CENTER, "-");

          it.printf(240, 102, id(font_badge), blue_light, TextAlign::CENTER, "%i%%", volume);

          sentinel_ui::draw_rounded_card(it, 270, 88, 30, 28, 6, card_bg, card_border);
          it.print(285, 102, id(font_medium), white, TextAlign::CENTER, "+");

          // Row 3: Sleep Delay [14..306, 128..168]
          sentinel_ui::draw_rounded_card(it, 14, 128, 292, 40, 8, card_bg, card_border);
          it.print(26, 140, id(font_icon_bar), amber, TextAlign::TOP_LEFT, "\U000F04B2");
          it.print(52, 148, id(font_small), white, TextAlign::CENTER_LEFT, "Sleep Delay");

          sentinel_ui::draw_rounded_card(it, 180, 134, 30, 28, 6, card_bg, card_border);
          it.print(195, 148, id(font_medium), white, TextAlign::CENTER, "-");

          it.printf(240, 148, id(font_badge), amber, TextAlign::CENTER, "%is", (int)id(mem_settings_sleep_delay).state);

          sentinel_ui::draw_rounded_card(it, 270, 134, 30, 28, 6, card_bg, card_border);
          it.print(285, 148, id(font_medium), white, TextAlign::CENTER, "+");

      - id: screen_saver_page
        lambda: |-
          it.fill(Color::BLACK);
          it.image(82, 120, id(sleeping_img), ImageAlign::CENTER);
          it.strftime(241, 75, id(font_large), white, TextAlign::CENTER, "%H:%M", id(ha_time).now());
          it.strftime(241, 114, id(font_small), blue_light, TextAlign::CENTER, "%A, %d %b", id(ha_time).now());
          if (id(s3temp).has_state()) {
            sentinel_ui::draw_rounded_card(it, 175, 138, 132, 26, 6, card_bg, card_border);
            it.printf(241, 151, id(font_badge), grey, TextAlign::CENTER, "Room: %.1f°C", id(s3temp).state);
          }

      - id: touchscreen_error_page
        lambda: |-
          it.fill(Color::BLACK);
          it.image(160, 75, id(error_img), ImageAlign::CENTER);
          sentinel_ui::draw_rounded_card(it, 20, 138, 280, 84, 8, card_bg, red);
          it.print(160, 154, id(font_small), white, TextAlign::CENTER, "Touchscreen setup failed");
          it.printf(160, 176, id(font_small), amber, TextAlign::CENTER, "Rebooting in %i seconds...", id(touchscreen_error_counter));
          it.print(160, 198, id(font_badge), text_dim, TextAlign::CENTER, "Push top-left button to cancel");
